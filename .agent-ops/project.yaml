project:
  id: stack-explorer
  display_name: Stack Explorer
  status: active
  purpose: |
    Multi-dimensional analytics platform for the AI agent and developer-tooling
    ecosystem. Tracks, scores, and compares repositories through configurable
    lenses and dimensions, producing scorecards, gap analyses, and findings.
    Emerging second role: an app-specific RAG-for-code knowledge base — ingesting
    symbols, audits, and findings into a queryable daemon-accessible store, and
    acting as a pipeline partner for Tesseract's Knowledge domain.

catalog:
  torque_project_id: null            # not found — no Torque project ID in catalog or repo
  cerberus_project_id: null          # none — project is local-first, not Cerberus-managed
  tether_catalog_project: stack-explorer  # ~/.tether/catalog/projects/stack-explorer.yaml

locations:
  repo: ~/dev/hollis-labs/apps/stack-explorer
  agent_os_tracking: ~/dev/agent-os/workspaces/execution/stack-explorer
  state_dir: null                    # no ~/.stack-explorer state dir; DB lives in repo at data/
  catalog: null
  artifacts: null                    # no ~/.cerberus/apps/stack-explorer — not Cerberus-built

build:
  authority: local                  # built via Makefile; no .github/workflows, no Cerberus resource
  resource: null
  command: make build                # -> ./stack-explorer (also: make build-full, make install, make test)

deployment:
  type: none                         # local-first CLI + daemon; no launchd service
  service_name: null
  binary: ~/dev/hollis-labs/apps/stack-explorer/stack-explorer  # built artifact; `make install` -> ~/go/bin/stack-explorer

docs:
  readme: CLAUDE.md                  # no README.md; CLAUDE.md is the quick reference
  architecture: docs/proposed-knowledge-base-architecture.md
  adrs: null                         # no docs/adrs/ directory
  roadmap: null                      # no docs/roadmap.md; phase plan lives in the architecture doc

roadmap:
  current_phase: 'Phase A-F shipped (PR #1, 7983058); Phase G (project generalization) deferred — real-use shakedown in flight'
  pointer: null

usage_examples:
  - intent: Score a repo through a specific perspective
    command: ./stack-explorer score get <repo-id> --lens chat-app
    note: Lenses select and weight dimensions; no re-scoring needed to switch lens.
  - intent: Check database health and table counts
    command: ./stack-explorer db stats
    note: SQLite DB at data/stack-explorer.db is gitignored.
  - intent: Serve the REST API for the Sigil frontend
    command: ./stack-explorer serve --port 8080
    note: Chi-based HTTP server in internal/api/.
  - intent: Expose repo knowledge to agents over MCP
    command: ./stack-explorer mcp --transport stdio
    note: Read-heavy tool surface; see docs/mcp-tools.md.
  - intent: Run an automated repo analysis
    command: hadron run <abs-path>/blueprints/se-repo-scan.yaml --input repo_path=... --input repo_id=...
    note: Hadron resolves blueprint paths server-side — always use absolute paths.

scopes:
  - stack-explorer.backend.main

related_projects: [tesseract, sigil, nanite, hadron]
